services:
  - type: web
    name: traceledger-backend
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: RPC_URL
        value: https://testnetrpc.mstblockchain.com
      - key: CHAIN_ID
        value: "91562037"
      - key: CONTRACT_ADDRESS
        value: "0xbc3Df4D18248f6c5043313b4DC78332ac635E039"
      - key: PRIVATE_KEY
        sync: false
      # Required in live mode: POST /api/batches is refused without it
      - key: BACKEND_API_KEY
        generateValue: true
      - key: BATCH_SIGNER_PUBLIC_KEY
        sync: false
