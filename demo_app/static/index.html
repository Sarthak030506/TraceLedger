<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TraceLedger - Expense Tracker Demo</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --danger: #ef4444;
      --success: #22c55e;
      --warning: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 24px 16px;
    }
    .container { max-width: 960px; margin: 0 auto; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--card-border);
    }
    h1 { font-size: 1.5rem; font-weight: 700; color: var(--primary); }
    .status-bar {
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid var(--primary);
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 0.875rem;
      font-family: monospace;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
    @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }
    .card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 20px;
    }
    .card h2 { font-size: 1.125rem; font-weight: 600; margin-bottom: 16px; }
    label { display: block; font-size: 0.8125rem; color: var(--text-muted); margin-bottom: 4px; }
    input, select {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      color: var(--text);
      padding: 8px 12px;
      margin-bottom: 12px;
      font-size: 0.875rem;
    }
    input:focus, select:focus { outline: none; border-color: var(--primary); }
    button {
      background: var(--primary);
      color: #0f172a;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      padding: 8px 16px;
      cursor: pointer;
      font-size: 0.875rem;
      transition: background 0.15s ease;
    }
    button:hover { background: var(--primary-hover); }
    button.btn-danger { background: var(--danger); color: white; padding: 4px 8px; font-size: 0.75rem; }
    button.btn-secondary { background: var(--card-border); color: var(--text); }
    button.btn-sm { padding: 4px 8px; font-size: 0.75rem; }
    .actions-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.875rem; }
    th { padding: 10px 12px; color: var(--text-muted); border-bottom: 1px solid var(--card-border); }
    td { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      background: rgba(255,255,255,0.1);
    }
    .user-pill {
      background: #334155;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.8125rem;
    }
    .alert { padding: 8px 12px; border-radius: 6px; font-size: 0.8125rem; margin-bottom: 12px; display: none; }
    .alert-error { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid var(--danger); }
    .alert-success { background: rgba(34, 197, 94, 0.2); color: #86efac; border: 1px solid var(--success); }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>TraceLedger Demo Expense Tracker</h1>
        <p style="font-size: 0.8125rem; color: var(--text-muted);">Audited Security Logging via Sidecar</p>
      </div>
      <div id="userHeader" style="display: flex; align-items: center; gap: 10px;">
        <span class="user-pill" id="currentUserDisplay">Logged in: <strong>alice</strong></span>
        <button class="btn-secondary btn-sm" onclick="logout()">Logout</button>
      </div>
    </header>

    <!-- Status Line -->
    <div class="status-bar">
      <div>Audit Status: <span id="auditStatus">events sent: 0, queued: 0</span></div>
      <button class="btn-secondary btn-sm" onclick="refreshStatus()">Refresh</button>
    </div>

    <!-- Login Modal/Card (if not logged in) -->
    <div id="loginCard" class="card" style="margin-bottom: 24px; display: none;">
      <h2>Sign In</h2>
      <div id="loginAlert" class="alert alert-error"></div>
      <div style="max-width: 360px;">
        <label>User</label>
        <select id="loginUser">
          <option value="alice">alice (password: password123)</option>
          <option value="bob">bob (password: builder456)</option>
        </select>
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="Enter password">
        <button onclick="handleLogin()">Sign In</button>
      </div>
    </div>

    <!-- App Main Content -->
    <div id="appContent">
      <div class="grid">
        <!-- Budget Card -->
        <div class="card">
          <h2>Monthly Budget Limit</h2>
          <div style="font-size: 1.5rem; font-weight: 700; margin-bottom: 12px; color: var(--warning);">
            ₹<span id="budgetRupees">0.00</span>
            <span style="font-size: 0.8125rem; font-weight: normal; color: var(--text-muted);">
              (<span id="budgetPaise">0</span> paise)
            </span>
          </div>
          <label>Update Budget (in paise, integer)</label>
          <input type="number" id="newBudgetInput" placeholder="e.g. 5000000">
          <button onclick="updateBudget()">Update Budget</button>
        </div>

        <!-- Add Expense Card -->
        <div class="card">
          <h2>Add New Expense</h2>
          <label>Category</label>
          <select id="expenseCategory">
            <option value="travel">Travel & Transit</option>
            <option value="meals">Meals & Food</option>
            <option value="supplies">Office Supplies</option>
            <option value="utilities">Utilities & Cloud</option>
            <option value="software">Software Subscriptions</option>
          </select>
          <label>Amount (in paise, integer — e.g. 15000 for ₹150.00)</label>
          <input type="number" id="expenseAmount" placeholder="15000">
          <label>Description</label>
          <input type="text" id="expenseDescription" placeholder="Flight, lunch, hosting...">
          <button onclick="createExpense()">Add Expense</button>
        </div>
      </div>

      <!-- Expense List -->
      <div class="card">
        <div class="actions-bar">
          <h2>Expenses</h2>
          <button onclick="exportCSV()" class="btn-secondary">Export CSV</button>
        </div>
        <div style="overflow-x: auto;">
          <table>
            <thead>
              <tr>
                <th>Date (UTC)</th>
                <th>User</th>
                <th>Category</th>
                <th>Description</th>
                <th>Amount (Paise / ₹)</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="expenseTableBody">
              <tr><td colspan="6" style="text-align: center; color: var(--text-muted);">Loading expenses...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentUser = localStorage.getItem("traceledger_user") || "alice";

    function updateAuthUI() {
      if (!currentUser) {
        document.getElementById("loginCard").style.display = "block";
        document.getElementById("appContent").style.display = "none";
        document.getElementById("userHeader").style.display = "none";
      } else {
        document.getElementById("loginCard").style.display = "none";
        document.getElementById("appContent").style.display = "block";
        document.getElementById("userHeader").style.display = "flex";
        document.getElementById("currentUserDisplay").innerHTML = `Logged in: <strong>${currentUser}</strong>`;
        loadData();
      }
    }

    async function handleLogin() {
      const user = document.getElementById("loginUser").value;
      const pass = document.getElementById("loginPassword").value;
      const alert = document.getElementById("loginAlert");
      alert.style.display = "none";

      try {
        const resp = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: user, password: pass })
        });
        if (resp.ok) {
          currentUser = user;
          localStorage.setItem("traceledger_user", user);
          updateAuthUI();
        } else {
          const err = await resp.json();
          alert.innerText = err.detail || "Authentication failed";
          alert.style.display = "block";
        }
      } catch (e) {
        alert.innerText = "Error connecting to server";
        alert.style.display = "block";
      }
      refreshStatus();
    }

    function logout() {
      currentUser = null;
      localStorage.removeItem("traceledger_user");
      updateAuthUI();
    }

    async function refreshStatus() {
      try {
        const res = await fetch("/api/status");
        if (res.ok) {
          const data = await res.json();
          document.getElementById("auditStatus").innerText = `events sent: ${data.events_sent}, queued: ${data.queued}`;
        }
      } catch (e) {}
    }

    async function loadData() {
      await Promise.all([loadBudget(), loadExpenses(), refreshStatus()]);
    }

    async function loadBudget() {
      try {
        const res = await fetch("/api/budget");
        if (res.ok) {
          const data = await res.json();
          const paise = data.budget_minor;
          document.getElementById("budgetPaise").innerText = paise;
          document.getElementById("budgetRupees").innerText = (paise / 100).toFixed(2);
        }
      } catch (e) {}
    }

    async function updateBudget() {
      const val = parseInt(document.getElementById("newBudgetInput").value, 10);
      if (isNaN(val) || val < 0) {
        alert("Please enter a valid positive integer in paise");
        return;
      }
      const res = await fetch("/api/budget", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ budget_minor: val, user: currentUser })
      });
      if (res.ok) {
        document.getElementById("newBudgetInput").value = "";
        loadBudget();
        refreshStatus();
      } else {
        const err = await res.json();
        alert(err.detail || "Failed to update budget");
      }
    }

    async function loadExpenses() {
      try {
        const res = await fetch("/api/expenses");
        if (res.ok) {
          const items = await res.json();
          const tbody = document.getElementById("expenseTableBody");
          if (items.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: var(--text-muted);">No expenses recorded yet.</td></tr>';
            return;
          }
          tbody.innerHTML = items.map(exp => `
            <tr>
              <td>${exp.created_at.replace("T", " ").replace("Z", "")}</td>
              <td><span class="badge">${exp.user}</span></td>
              <td>${exp.category}</td>
              <td>${exp.description}</td>
              <td>
                <strong>₹${(exp.amount_minor / 100).toFixed(2)}</strong>
                <span style="font-size: 0.75rem; color: var(--text-muted);">(${exp.amount_minor}p)</span>
              </td>
              <td>
                <button class="btn-secondary btn-sm" onclick="editExpense('${exp.id}', ${exp.amount_minor})">Edit Amount</button>
                <button class="btn-danger btn-sm" onclick="deleteExpense('${exp.id}')">Delete</button>
              </td>
            </tr>
          `).join("");
        }
      } catch (e) {}
    }

    async function createExpense() {
      const category = document.getElementById("expenseCategory").value;
      const amount = parseInt(document.getElementById("expenseAmount").value, 10);
      const desc = document.getElementById("expenseDescription").value;

      if (isNaN(amount) || amount <= 0) {
        alert("Amount must be a positive integer in paise (no decimals)");
        return;
      }
      if (!desc.trim()) {
        alert("Description is required");
        return;
      }

      const res = await fetch("/api/expenses", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          user: currentUser,
          category: category,
          amount_minor: amount,
          description: desc.trim()
        })
      });

      if (res.ok) {
        document.getElementById("expenseAmount").value = "";
        document.getElementById("expenseDescription").value = "";
        loadExpenses();
        refreshStatus();
      } else {
        const err = await res.json();
        alert(err.detail || "Failed to add expense");
      }
    }

    async function editExpense(id, currentAmount) {
      const input = prompt("Enter new amount in paise (integer):", currentAmount);
      if (input === null) return;
      const newAmount = parseInt(input, 10);
      if (isNaN(newAmount) || newAmount <= 0) {
        alert("Invalid amount. Must be a positive integer in paise.");
        return;
      }
      const res = await fetch(`/api/expenses/${id}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ amount_minor: newAmount, user: currentUser })
      });
      if (res.ok) {
        loadExpenses();
        refreshStatus();
      } else {
        const err = await res.json();
        alert(err.detail || "Failed to update expense");
      }
    }

    async function deleteExpense(id) {
      if (!confirm("Are you sure you want to delete this expense?")) return;
      const res = await fetch(`/api/expenses/${id}?user=${currentUser}`, { method: "DELETE" });
      if (res.ok) {
        loadExpenses();
        refreshStatus();
      } else {
        const err = await res.json();
        alert(err.detail || "Failed to delete expense");
      }
    }

    function exportCSV() {
      window.location.href = `/api/export?user=${currentUser}`;
      setTimeout(refreshStatus, 500);
    }

    // Initialize UI and periodic status poll
    updateAuthUI();
    setInterval(refreshStatus, 4000);
  </script>
</body>
</html>
